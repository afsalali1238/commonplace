name: CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json is the committed, CI-canonical lockfile; bun.lock
      # is gitignored (local-dev only). `npm ci` is reproducible; the old
      # bun.lock-first branch never ran in CI because the file isn't there.
      - name: Install
        run: npm ci
      - name: Validate nodes (incl. generated-content freshness)
        run: npx tsx scripts/validate-nodes.ts
      - name: Lint
        run: npx eslint . --max-warnings 10
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build (+ SW manifest)
        run: npm run build
      - name: Check TOPICS-INDEX freshness
        run: |
          npx tsx scripts/topics-index.ts
          git diff --exit-code docs/TOPICS-INDEX.md docs/TOPICS-INDEX.csv || (echo "::warning::TOPICS-INDEX out of date — run npx tsx scripts/topics-index.ts and commit" && exit 1)
      # `npm run build` above already regenerated both files via prebuild, so a
      # non-empty diff here means the committed copies disagreed with what the
      # build produces — usually a stale sitemap left behind after nodes or
      # archives changed. The re-run is belt-and-braces so the step also works
      # if the build step is ever reordered or skipped.
      - name: Check sitemap + robots freshness
        run: |
          npx tsx scripts/generate-sitemap.ts
          npx tsx scripts/generate-robots.ts
          git diff --exit-code public/sitemap.xml public/robots.txt || (echo "::warning::sitemap.xml/robots.txt out of date — run npm run prebuild and commit the regenerated files" && exit 1)
      - name: Bundle size limit
        # Hard limit since the data-layer split (TECH_DEBT §2): the largest
        # client chunk is the generated index (~124 KB gzipped at 451 nodes,
        # 2026-09-14), down from ~442 KB before the split. The limit is set
        # well above that so normal feature work fits but accidentally
        # bundling the node bodies (or another 100 KB of content into the
        # index) fails loudly instead of silently regressing.
        env:
          LIMIT_KB: 260
        run: |
          max=0; maxf=""
          {
            echo "### Client bundle (gzipped, limit ${LIMIT_KB} KB per chunk)"
            echo '```'
            for f in dist/client/assets/*.js; do
              kb=$(( $(gzip -c "$f" | wc -c) / 1024 ))
              if [ "$kb" -gt "$max" ]; then max=$kb; maxf=$(basename "$f"); fi
              printf "%8s KB  %s\n" "$kb" "$(basename "$f")"
            done | sort -rn | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "largest chunk: ${maxf} = ${max} KB gz"
          if [ "$max" -gt "$LIMIT_KB" ]; then
            echo "::error::${maxf} is ${max} KB gzipped, over the ${LIMIT_KB} KB limit. Did the node bodies end up in the bundle? See docs/CONTENT-LAYER.md."
            exit 1
          fi
